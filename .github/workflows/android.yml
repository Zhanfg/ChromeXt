name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main
    - name: set up JDK 21
      uses: actions/setup-java@main
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Test extension archive import
      run: ./gradlew app:testDebugUnitTest

    - name: Build debug
      run: ./gradlew app:assembleDebug
        
    - name: Build release
      run: ./gradlew app:assembleRelease

    - name: Verify release Xposed entry point
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex code \
          --class org.matrix.chromext.MainHook --method '<init>()V' \
          app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Package MV3 smoke-test extension
      run: |
        (cd tests/fixtures/mv3-smoke && zip -q "$GITHUB_WORKSPACE/ChromeXt_MV3_Smoke.zip" manifest.json smoke.js smoke.css)

    - name: Upload MV3 smoke-test extension
      uses: actions/upload-artifact@main
      with:
        name: ChromeXt_MV3_Smoke.zip
        path: ChromeXt_MV3_Smoke.zip

    - name: Rename debug build
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/ChromeXt_debug.apk

    - name: Rename signed apk
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      run: mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/ChromeXt.apk


    - uses: noriban/sign-android-release@master
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      name: Sign app APK
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload debug build
      uses: actions/upload-artifact@main
      with:
        name: ChromeXt_debug.apk
        path: app/build/ChromeXt_debug.apk

    - name: Upload signed APK
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      uses: actions/upload-artifact@main
      with:
        name: ChromeXt_signed.apk
        path: ${{steps.sign_app.outputs.signedReleaseFile}}

    - name: Collect debug build
      uses: actions/download-artifact@main
      with:
        name: ChromeXt_debug.apk

    - name: Collect signed APK
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      uses: actions/download-artifact@main
      with:
        name: ChromeXt_signed.apk
